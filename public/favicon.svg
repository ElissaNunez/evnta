<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <!-- E = 3 lines same length, flat right -->
  <rect x="2" y="6" width="30" height="9" rx="4.5" fill="url(#g)" opacity="0.95"/>
  <rect x="2" y="22" width="30" height="9" rx="4.5" fill="url(#g)" opacity="0.85"/>
  <rect x="2" y="38" width="30" height="9" rx="4.5" fill="url(#g)" opacity="0.7"/>
  <!-- V = checkmark -->
  <line x1="30" y1="22" x2="38" y2="50" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <line x1="38" y1="50" x2="56" y2="6" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <!-- Dot -->
  <circle cx="50" cy="14" r="7" fill="url(#g)"/>
</svg>
